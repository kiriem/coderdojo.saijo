- id: "2026-07-13"
  date: "2026-07-13"
  category: report
  title: 第5回 CoderDojo 西条を開催しました！
  summary: 第5回 CoderDojo 西条を開催。代表のイギリス出張レポート。
  content: |
    第5回 CoderDojo 西条を開催しました。今回は、7名の皆さんにご参加いただきました。

    それぞれが自分のつくりたいものや取り組みたいことに向き合いながら、参加者同士で作品を見せ合ったり、分からないことを相談したりする姿が見られました。

    <img src="data/images/20260713-123929-e81645c4.jpg">

    今回は、Championの宮島がイギリスで開催されたRaspberry Pi財団主催のイベントに参加してきたため、現地でいただいたステッカーを参加者の皆さんにお土産として配りました。

    また、同じ広島県内で活動するCoderDojo 福山大門のChampionにも遊びに来ていただきました。ご参加いただき、ありがとうございました。

    地域を越えて運営者や参加者が交流できることも、CoderDojoの魅力の一つです。中・四国地方のCoderDojoコミュニティがさらに盛り上がっていくよう、これからも活動を続けていきます。

    <img src="data/images/20260713-124130-7424d5b7.jpg">

    CoderDojoは、リアルな場に集まり、お互いが取り組んでいることに興味を持ち、作品やアイデアを通して学び合うことのできるコミュニティです。
    今回も、それぞれの活動から新しい発見や交流が生まれる、すてきな時間となりました。

    次回は 8月11日（火・祝）10:00-12:00 です。夏休み中ではありますが、皆様のご参加をお待ちしております。
  externalLink: ""
